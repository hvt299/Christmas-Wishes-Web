<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" fill="none" class="santa-sleigh-svg">
  <defs>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" />
      <stop offset="40%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="magicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. BỤI PHÉP THUẬT LẤP LÁNH PHÍA SAU ĐUÔI CỖ XE (BÊN TRÁI) -->
  <g fill="#FEF08A" opacity="0.85">
    <circle cx="6" cy="48" r="1.5" />
    <circle cx="12" cy="54" r="1" />
    <circle cx="16" cy="44" r="2" />
    <circle cx="24" cy="50" r="1.2" />
    <circle cx="10" cy="38" r="1.2" />
    <circle cx="20" cy="36" r="1.8" />
  </g>

  <!-- 2. CỖ XE TRƯỢT TUYẾT & ÔNG GIÀ NOEL (Ở PHÍA SAU - BÊN TRÁI: X = 15) -->
  <g transform="translate(15, 12)" fill="url(#goldGlow)" filter="url(#magicGlow)">
    <!-- Túi quà to phồng phía sau cỗ xe (bên trái) -->
    <path d="M 45 42 C 40 30, 48 20, 60 22 C 72 24, 76 34, 70 45 Z" opacity="0.95" />
    <!-- Thân xe trượt tuyết uốn lượn cổ điển (mũi vểnh sang phải) -->
    <path d="M 35 46 C 45 46, 75 46, 82 44 C 86 42, 88 38, 85 36 C 82 34, 78 36, 72 38 C 50 38, 42 42, 35 46 Z" />
    <path d="M 35 46 C 30 46, 28 42, 30 38 C 32 35, 38 36, 42 38 C 45 43, 40 46, 35 46 Z" />
    
    <!-- Lưỡi trượt tuyết mạ vàng cong vút về phía trước bên phải -->
    <path d="M 22 55 Q 55 58, 85 54 Q 92 53, 95 48 C 96 46, 93 45, 91 47 Q 87 51, 80 52 Q 55 53, 26 50 Q 20 48, 18 44 C 16 42, 14 43, 15 46 Q 17 52, 22 55 Z" />
    <!-- Trụ nối thân xe với thanh trượt -->
    <rect x="36" y="44" width="3" height="9" rx="1.5" />
    <rect x="68" y="43" width="3" height="9" rx="1.5" />

    <!-- Ông già Noel (Santa Claus) - Thân & mặt hướng về bên phải -->
    <!-- Thân áo tròn ấm áp -->
    <ellipse cx="50" cy="34" rx="9" ry="8" />
    <!-- Đầu & Chòm râu trắng đặc trưng hướng sang phải -->
    <circle cx="53" cy="24" r="5" />
    <path d="M 52 24 C 55 26, 58 31, 55 35 C 52 35, 49 32, 50 27 Z" fill="#FFFFFF" />
    <!-- Mũ Noel chóp đỏ rủ ra sau bên trái có quả bông tròn -->
    <path d="M 49 22 C 47 16, 41 17, 38 18 C 39 20, 42 20, 45 22 Z" fill="#EF4444" />
    <circle cx="37" cy="18" r="2.5" fill="#FFFFFF" />
    <!-- Cánh tay vươn ra cầm dây cương vẫy chào về phía trước (bên phải) -->
    <path d="M 54 31 C 60 30, 65 33, 67 36" stroke="url(#goldGlow)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- 3. DÂY CƯƠNG NỐI TỪ SANTA ĐẾN ĐÀN TUẦN LỘC (TỪ TRÁI SANG PHẢI) -->
  <path d="M 82 48 Q 115 53, 145 46" stroke="url(#goldGlow)" stroke-width="1.2" stroke-dasharray="3,1" opacity="0.85" />
  <path d="M 175 46 Q 205 52, 240 44" stroke="url(#goldGlow)" stroke-width="1" stroke-dasharray="3,1" opacity="0.75" />

  <!-- 4. TUẦN LỘC THỨ 2 (Ở GIỮA: X = 135) - PHI NƯỚC ĐẠI VỀ BÊN PHẢI -->
  <g transform="translate(135, 20)" fill="url(#goldGlow)" filter="url(#magicGlow)">
    <!-- Thân & Cơ bắp (hướng sang phải) -->
    <path d="M 28 26 C 22 22, 16 23, 11 28 C 8 26, 4 27, 2 30 C 0 33, 2 36, 6 36 C 14 36, 18 34, 25 35 C 28 35, 30 33, 28 26 Z" />
    <!-- Cổ & Đầu (ngẩng cao hướng sang phải) -->
    <path d="M 24 26 C 26 21, 28 16, 32 14 C 34 13, 37 13, 38 15 C 38 17, 36 19, 34 21 C 32 23, 31 27, 28 30 Z" />
    <!-- Sừng hươu (Antlers) vươn cao -->
    <path d="M 33 13 C 33 9, 31 6, 28 4 M 32 8 C 34 6, 37 5, 38 3 M 33 10 C 36 9, 39 10, 41 8" stroke="url(#goldGlow)" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Chân trước phi nước đại về phía trước bên phải -->
    <path d="M 26 34 C 29 38, 35 41, 40 40 M 27 34 C 31 36, 34 38, 36 43" stroke="url(#goldGlow)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Chân sau co lại trong không trung phía sau bên trái -->
    <path d="M 8 34 C 4 38, 1 44, -3 46 M 12 34 C 8 39, 5 43, 3 47" stroke="url(#goldGlow)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Đuôi nhỏ -->
    <path d="M 2 28 C 0 27, -2 29, 0 31 Z" />
  </g>

  <!-- 5. TUẦN LỘC DẪN ĐẦU (RUDOLPH Ở PHÍA TRƯỚC - BÊN PHẢI: X = 230) -->
  <g transform="translate(230, 18)" fill="url(#goldGlow)" filter="url(#magicGlow)">
    <!-- Thân & Cơ bắp -->
    <path d="M 28 26 C 22 22, 16 23, 11 28 C 8 26, 4 27, 2 30 C 0 33, 2 36, 6 36 C 14 36, 18 34, 25 35 C 28 35, 30 33, 28 26 Z" />
    <!-- Cổ & Đầu -->
    <path d="M 24 26 C 26 21, 28 16, 32 14 C 34 13, 37 13, 38 15 C 38 17, 36 19, 34 21 C 32 23, 31 27, 28 30 Z" />
    <!-- Mũi đỏ rực rỡ Rudolph ở mỏm đầu phía trước (x = 38) -->
    <circle cx="38" cy="14" r="2.2" fill="#EF4444" filter="url(#magicGlow)" />
    <!-- Sừng hươu (Antlers) -->
    <path d="M 33 13 C 33 9, 31 6, 28 4 M 32 8 C 34 6, 37 5, 38 3 M 33 10 C 36 9, 39 10, 41 8" stroke="url(#goldGlow)" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <!-- Chân trước phi nước đại về phía trước bên phải -->
    <path d="M 26 34 C 29 38, 35 41, 40 40 M 27 34 C 31 36, 34 38, 36 43" stroke="url(#goldGlow)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Chân sau co lại trong không trung phía sau bên trái -->
    <path d="M 8 34 C 4 38, 1 44, -3 46 M 12 34 C 8 39, 5 43, 3 47" stroke="url(#goldGlow)" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Đuôi nhỏ -->
    <path d="M 2 28 C 0 27, -2 29, 0 31 Z" />
  </g>
</svg>